[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spdtst"
version = "0.1.0"
description = "A small, private-by-default internet speed test CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["truststore>=0.10,<1"]
license = {file = "LICENSE"}
authors = [{name = "Bruno Zapico"}]
keywords = ["speedtest", "cli", "network", "internet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
spdtst = "spdtst.cli:main"

[project.urls]
Homepage = "https://github.com/brunozapico/speed_tester"
Repository = "https://github.com/brunozapico/speed_tester"
Issues = "https://github.com/brunozapico/speed_tester/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
