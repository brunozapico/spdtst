<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">spdtst terminal demo</title>
  <desc id="desc">A dark terminal showing a completed spdtst test_full command.</desc>
  <rect width="960" height="450" rx="22" fill="#0d1117"/>
  <rect x="0" y="0" width="960" height="58" rx="22" fill="#161b22"/>
  <circle cx="38" cy="29" r="8" fill="#ff5f57"/><circle cx="64" cy="29" r="8" fill="#febc2e"/><circle cx="90" cy="29" r="8" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">
    <text x="48" y="108" fill="#8b949e">$</text><text x="76" y="108" fill="#f0f6fc">spdtst test_full --save</text>
    <text x="48" y="158" fill="#8b949e">Finding the nearest available server…</text>
    <text x="48" y="196" fill="#8b949e">Testing with Buenos Aires, Argentina…</text>
    <text x="48" y="258" fill="#f0f6fc">Server</text><text x="255" y="258" fill="#8b949e">Buenos Aires, Argentina</text>
    <text x="48" y="296" fill="#f0f6fc">Download</text><text x="255" y="296" fill="#3fb950">196.40 Mbps</text>
    <text x="48" y="334" fill="#f0f6fc">Upload</text><text x="255" y="334" fill="#3fb950">41.80 Mbps</text>
    <text x="48" y="372" fill="#f0f6fc">Latency</text><text x="255" y="372" fill="#58a6ff">12.00 ms</text>
    <text x="520" y="372" fill="#f0f6fc">Jitter</text><text x="645" y="372" fill="#58a6ff">2.00 ms</text>
    <text x="48" y="418" fill="#8b949e">Saved to ~/.local/state/spdtst/results.jsonl</text>
  </g>
</svg>
